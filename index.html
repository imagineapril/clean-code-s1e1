<!DOCTYPE html>
<html>
  <head>
    <title>Todo App</title>
    <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet">
    <link rel="stylesheet" href="style.css" media="screen" charset="utf-8">
  </head>
  <body class="body">
    <header class="header">
      <img class="header__img" src="./eisenhower-matrix.jpg" alt="eisenhower-matrix"><a class="header__more-inf" href="https://goal-life.com/page/method/matrix-eisenhower">Want more details?</a>
    </header>
    <main class="main">
      <section id="add-task__header"><label for="new-task">Add Item</label>
      <div class="add-task__wrapper">
        <input id="new-task" class="task" type="text">
        <button class="btn">Add</button>
      </div>
      </section>
      <section>
        <h3 class="heading-3">Todo</h3>
        <ul class="tasks-list" id="incomplete-tasks">
          <li class="tasks-item">
            <input type="checkbox"><label class="task">Pay Bills</label>
            <input type="text" class="task">
            <button class="btn btn_edit">Edit</button>
            <button class="btn btn_delete"><img src="./remove.svg" alt="remove-icon"></button>
          </li>
          <li class="tasks-item edit-mode">
            <input type="checkbox"><label class="task">Go Shopping</label>
            <input type="text" value="Go Shopping" class="task">
            <button class="btn btn_edit">Save</button>
            <button class="btn btn_delete"><img src="./remove.svg" alt="remove-icon"></button>
          </li>
        </ul>
      </section>
      <section>
        <h3 class="heading-3">Completed</h3>
        <ul class="tasks-list" id="completed-tasks">
          <li class="tasks-item">
            <input type="checkbox" checked><label class="task">See the Doctor</label>
            <input type="text" class="task">
            <button class="btn btn_edit">Edit</button>
            <button class="btn btn_delete"><img src="./remove.svg" alt="remove-icon"></button>
          </li>
        </ul>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
